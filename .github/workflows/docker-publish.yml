# 构建 Ai Lubricant 数据服务镜像并发布到 GitHub Container Registry (GHCR)。
#
# 该镜像内含三个入口（main / node_server / tunnel_server），与 docker-compose.yml
# 中的 `ai-lubricant:<TAG>` 完全一致——compose 里由 ai-lubricant 服务 build 一次，
# node-server / tunnel-server 仅引用同一 tag 并按服务分配 command。因此这里只需
# 构建根目录 Dockerfile 一个镜像即可覆盖三种进程。
#
# 触发：
#   - push 到 main         → 发布 main 标签 + latest
#   - push tag v*          → 发布该 tag 标签 + latest
#   - pull_request 到 main → 仅构建校验，不推送
#   - workflow_dispatch    → 手动触发（可填 version 指定版本号，留空则自动推导）
#
# 版本可核验：镜像内置 APP_VERSION —— 这是**上游原生**的版本标识（Dockerfile 的
#   `ARG APP_VERSION` + `ENV APP_VERSION`；docker-compose.yml 也以
#   `APP_VERSION: "${TAG:-local}"` 传它，lan_discovery.py 读它）。本 fork **不引入
#   额外别名**，直接用上游的 APP_VERSION。
#   tag 推送 = 该 tag，人工 input = 该 input，分支推送 = main-<7hex>。
#   核验：docker exec <容器> printenv APP_VERSION
#   权威发布路径是 .github/workflows/sync-upstream.yml（生成 vYYMMDD.N tag 后
#   `gh workflow run docker-publish.yml --ref <tag>`）。
#
# 注：vYYMMDD.N 只有两段，不是合法 semver，故 metadata-action 不配 type=semver
#   （配了也永不命中，反而误导）。tag 规则里那条 type=raw 只在人工填了
#   workflow_dispatch 的 version input 时才启用。
#
# 前置：仓库 Settings → Actions → General → Workflow permissions 需允许读写
#   （packages: write）。默认的 GITHUB_TOKEN 已足够推送到本仓库的 GHCR，无需额外密钥。
#
# 说明：构建上下文已由 .dockerignore 收敛，仅保留运行时业务文件（node_server/ 与
#   user-frontend/ 随镜像，user-frontend/dist 由子模块提供，故 checkout 必须带子模块）。
#   构建参数：PIP_INDEX_URL 指向 PyPI（Dockerfile 默认清华源，仅适合国内构建）；
#   DOCKER_REGISTRY_PREFIX 留空 = 直连 Docker Hub（国内构建可改为加速器前缀）。

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：人工发布的版本号（如 v260917.1）。留空 = 按触发方式自动推导（tag 推送用 tag，分支推送用 main-<7hex>）"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .gitmodules 用相对 URL（../ai-lubricant-*.git），在 fork 里会解析成
      # winffychu/ai-lubricant-*.git（不存在）。子模块只在上游 wuxin-gh，这里改写前缀后初始化。
      - name: 检出子模块（改写到上游 wuxin-gh，user-frontend/dist 随子模块提供）
        run: |
          git config --global url."https://github.com/wuxin-gh/".insteadOf "https://github.com/winffychu/"
          git submodule update --init --recursive --depth 1

      - name: Set up QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（PR 不登录）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') }}

      # 可核验版本号：tag 推送 → 该 tag；人工填了 input → 该 input；其余（分支推送）
      # → main-<7hex>。作为 build-arg APP_VERSION 传给 Dockerfile（上游原生参数），
      # 运维用 `docker exec <容器> printenv APP_VERSION` 即可核验。
      # 注：vYYMMDD.N 不是合法 semver，故不配置 type=semver 规则（永不命中）。
      - name: 解析可核验版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            v="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v="main-${GITHUB_SHA::7}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${v}"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 同时产出 amd64 / arm64，单 tag 多架构清单。
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            DOCKER_REGISTRY_PREFIX=
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

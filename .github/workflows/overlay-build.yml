# 生产构建链路：clone 上游 → 打补丁 → 构建 → 推送 → 拉回冒烟
#
# ── 这个仓库是什么 ────────────────────────────────────────────────────────
#   本仓库**不持有任何上游源代码**。它只是一份构建配方：
#     * 本文件（构建/发布/验收流程）
#     * .github/patches/（对上游源码的补丁，当前 0 个）
#   构建上下文是工作流里**现场 clone 出来的上游目录**（$GITHUB_WORKSPACE/upstream-src）。
#   本仓库只被 checkout 到 $GITHUB_WORKSPACE/overlay，仅用于提供补丁。
#
# ── 为什么这样做 ──────────────────────────────────────────────────────────
#   * 冲突面恒为零：本仓库不持有上游文件，就不存在 merge 冲突，也不需要"每周同步"
#     这套机制（原先 sync-upstream.yml 那 328 行的 merge/冲突 issue/GH_REPO 防劫持/
#     tag 回滚自愈逻辑全部消失）。
#   * 子模块的相对 URL 自动正确：.gitmodules 写的是 `../ai-lubricant-*.git`，相对
#     **origin** 解析。从上游 clone → wuxin-gh/ai-lubricant-*（存在）；从 fork clone
#     → winffychu/ai-lubricant-*（不存在）。所以"改写子模块 URL"那个补丁自动消失。
#   * 上游更新即生效：不需要同步、不存在"落后上游"这个状态。
#
# ── 与旧链路的关系（已退役）──────────────────────────────────────────────
#   本文件**取代**了原先的 4 条流水线：
#     docker-publish.yml   → 本文件的 build job
#     sync-upstream.yml    → 本文件的 schedule 触发（不再需要 merge，只需按上游最新构建）
#     ci.yml               → 本文件的 run_tests（**仅在有补丁时自动启用**，见下）
#     acceptance.yml       → 本文件的 verify job（矩阵覆盖 amd64 + arm64）
#
# ── 测试门禁的取舍（重要）────────────────────────────────────────────────
#   零补丁时**不跑**上游测试套件。理由：零补丁意味着镜像里的代码与上游提交**逐字节
#   相同**，没有"我们的改动"需要验证；跑上游测试等于替上游背它的测试健康度，
#   上游一旦有自己的红用例，我们的发布就会被卡住 —— 那正是"人工介入"的来源。
#   真正的门禁是 verify job：镜像能构建、能起、/mcp/health 能答。
#   一旦 patches/ 里有补丁（我们真的改了上游代码），测试套件**自动启用**。
#
# ── 版本标识 ──────────────────────────────────────────────────────────────
#   APP_VERSION = `upstream-<上游7hex>`（人工填 version 时用该值）。这是上游原生的
#   版本标识（Dockerfile `ARG APP_VERSION` + `ENV`；compose 以 `APP_VERSION: "${TAG:-local}"`
#   传它；lan_discovery.py 读它）。核验：docker exec <容器> printenv APP_VERSION
#   镜像同时带 OCI 标注声明**上游**仓库与**上游**提交（org.opencontainers.image.source/revision）。
#
#   标签：`<上游7hex>`（钉版本用）+ `latest`（生产口径）。原先的 vYYMMDD.N 约定已取消
#   —— 它需要读远端 tag 列表算序号，而那套机制只服务于"合并同步"这个已消失的场景。
#   要精确回滚请用 digest：REF=sha256:<digest> bash upgrade_compose.sh
#
# ── 权限 ──────────────────────────────────────────────────────────────────
#   Settings → Actions → General → Workflow permissions 需允许读写（packages: write）。

name: Build & Publish (overlay)

on:
  # 每周一 02:17 UTC = 10:17 北京时间：按上游最新提交构建并发布。
  # 这是"自动同步上游变更"在 overlay 模式下的等价物 —— 不是 merge，是重新构建。
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "要构建的上游 ref（分支/tag/完整 SHA）。留空 = main。"
        required: false
        default: ""
        type: string
      version:
        description: "可核验版本号（写进镜像 APP_VERSION）。留空 = upstream-<7hex>。"
        required: false
        default: ""
        type: string
      publish:
        description: "是否推送到 GHCR。取消勾选 = 只构建到本地 daemon（演练）。"
        required: false
        default: true
        type: boolean
      run_tests:
        description: "强制跑上游测试套件（有补丁时会自动启用，无需勾选）。"
        required: false
        default: false
        type: boolean

# 绝不并发、绝不取消在跑的一次：发布是原子操作，半途取消会留下不一致的状态。
concurrency:
  group: overlay-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: wuxin-gh/ai-lubricant
  UPSTREAM_URL: https://github.com/wuxin-gh/ai-lubricant.git
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  CTX: ${{ github.workspace }}/upstream-src
  OVERLAY: ${{ github.workspace }}/overlay

jobs:
  # ── 解析上游 SHA 与本次运行的选项 ─────────────────────────────────────────
  # 单独一个 job 先把 SHA 定死，后续所有步骤都用它，保证「日志里看到的 SHA」与
  # 「真正被构建的 SHA」是同一个值。
  # 选项也在这里归一化：schedule 触发时 inputs.* 全为空，必须显式给默认值，
  # 否则 `push: ${{ inputs.publish }}` 会变成空串 → 定时构建永远不推送。
  resolve:
    name: 解析上游提交与选项
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      ref: ${{ steps.r.outputs.ref }}
      publish: ${{ steps.o.outputs.publish }}
      run_tests: ${{ steps.o.outputs.run_tests }}
      version: ${{ steps.o.outputs.version }}
    steps:
      - name: 归一化运行选项（schedule 时 inputs 为空）
        id: o
        env:
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ inputs.upstream_ref }}
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_TESTS: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail
          ref="${IN_REF:-main}"
          # ★ 每个分支都必须给出**确定的** true/false，绝不允许空值透传。
          #   schedule：inputs.* 全为空 → 硬编码默认。
          #   workflow_dispatch：UI 里 boolean 一定带值，但**通过 REST API 触发时，
          #   漏传某个 input 会让它求值为空串**（而不是取 default）—— 若原样透传，
          #   `push: ${{ ... == 'true' }}` 得 false、`load:` 得 true，
          #   于是"演练模式"被静默启用：构建成功、日志全绿、**但什么都没推上去**。
          #   所以这里用 `:-` 兜底，把"空"一律解释为"用默认值"。
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            publish="${IN_PUBLISH:-true}"
            tests="${IN_TESTS:-false}"
          else
            # 定时/其它事件：发布，不强制跑测试（有补丁时 build job 会自动启用）。
            publish="true"
            tests="false"
          fi
          # 兜底之后再做一次穷举断言：宁可在这里红，也不要在 build 阶段静默不推送。
          case "${publish}" in
            true|false) ;;
            *) echo "::error::publish 归一化失败，得到 '${publish}'（应为 true/false）"; exit 1 ;;
          esac
          case "${tests}" in
            true|false) ;;
            *) echo "::error::run_tests 归一化失败，得到 '${tests}'（应为 true/false）"; exit 1 ;;
          esac
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "run_tests=${tests}" >> "$GITHUB_OUTPUT"
          echo "version=${IN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "事件=${EVENT}  ref=${ref}  publish=${publish}  run_tests=${tests}"

      - name: 解析上游提交 SHA
        id: r
        env:
          REF: ${{ steps.o.outputs.ref }}
        run: |
          set -euo pipefail
          # annotated tag 在 ls-remote 里会输出两行：tag 对象本身，以及以 ^{} 结尾的
          # 「解引用后的 commit」。必须优先取后者 —— 否则 sha 会是 tag 对象的 SHA，
          # checkout 后 HEAD 与它不等，断言会直接失败。
          out="$(git ls-remote "${UPSTREAM_URL}" "${REF}" || true)"
          sha="$(printf '%s\n' "${out}" | awk '/\^\{\}$/{print $1}' | head -1)"
          [ -n "${sha}" ] || sha="$(printf '%s\n' "${out}" | head -1 | cut -f1)"
          if [ -z "${sha}" ]; then
            # 分支/tag 没命中时，按「调用方直接给了 SHA」再试一次。
            case "${REF}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) sha="${REF}" ;;
              *) echo "::error::无法解析上游 ref '${REF}'"; exit 1 ;;
            esac
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "上游 ${UPSTREAM_REPO}@${REF} = ${sha}"

  # ── 构建 ──────────────────────────────────────────────────────────────────
  build:
    name: clone 上游 → 打补丁 → 构建
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      primary_tag: ${{ steps.ver.outputs.primary }}
      version: ${{ steps.ver.outputs.version }}
      patched: ${{ steps.patch.outputs.count }}

    # 仅 run_tests 需要；services 会无条件起，成本可忽略。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_lubricant
          POSTGRES_PASSWORD: ai_lubricant
          POSTGRES_DB: ai-lubricant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_lubricant -d ai-lubricant"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ai_lubricant
      POSTGRES_PASSWORD: ai_lubricant
      POSTGRES_DATABASE: ai-lubricant
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      # 本仓库只用来提供 patches/。checkout 到子目录 overlay/，与构建上下文完全分离。
      - name: Checkout 本仓库（仅取补丁）
        uses: actions/checkout@v4
        with:
          path: overlay

      # 关键：这里 clone 的是**上游**，不是我们自己的仓库。
      # 用 init + fetch 而不是 `clone --branch`：上游 ref 可能是分支/tag/完整 SHA，
      # fetch 三种都覆盖，`--branch` 只覆盖前两种。
      # remote 必须叫 origin —— .gitmodules 的相对 URL 是相对 origin 解析的。
      - name: clone 上游到构建上下文
        run: |
          set -euo pipefail
          git init -q "${CTX}"
          git -C "${CTX}" remote add origin "${UPSTREAM_URL}"
          if ! git -C "${CTX}" fetch --depth 1 origin "${UPSTREAM_SHA}" 2>/dev/null; then
            echo "· 按 SHA fetch 未成功，回退为按 ref fetch"
            git -C "${CTX}" fetch --depth 1 origin "${{ needs.resolve.outputs.ref }}"
          fi
          git -C "${CTX}" checkout -q --detach FETCH_HEAD
          # 全量子模块，不用白名单：白名单是按当前 .dockerignore 挑的，上游一旦新增
          # 或放行某个子模块就会悄悄漏掉构建所需的目录 —— 这类失败很难查。
          # 相对 URL 会自然解析到 wuxin-gh/ai-lubricant-*，无需任何 insteadOf 改写。
          git -C "${CTX}" submodule update --init --recursive --depth 1

      - name: 应用补丁（.github/patches/*.patch，按文件名排序）
        id: patch
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("${OVERLAY}"/.github/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "补丁数 = 0（本仓库对上游源码零改动），跳过"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "── 应用 $(basename "$p")"
            if ! git -C "${CTX}" apply -p1 --index --whitespace=nowarn "$p"; then
              echo "::error file=${p}::补丁应用失败。上游很可能改动了该补丁涉及的行；"\
          "请把补丁 rebase 到 ${UPSTREAM_SHA} 后重新提交。拒绝继续构建。"
              exit 1
            fi
          done
          echo "count=${#patches[@]}" >> "$GITHUB_OUTPUT"
          echo "已应用 ${#patches[@]} 个补丁"

      # ── 来源论证的机器可验证部分 ──────────────────────────────────────────
      - name: 断言构建上下文 100% 来自上游（零泄漏）
        run: |
          set -euo pipefail

          echo "构建上下文 = ${CTX}"
          echo "本仓库检出 = ${OVERLAY}（只提供补丁）"
          echo

          # 1) 上下文必须是独立于本仓库的另一个 git 仓库。
          ctx_root="$(git -C "${CTX}" rev-parse --show-toplevel)"
          [ "${ctx_root}" != "${OVERLAY}" ] \
            || { echo "::error::构建上下文就是本仓库的检出，断言失败"; exit 1; }

          # 2) ★ 结构不变量：CTX 与 OVERLAY 必须互不包含。
          #      - CTX 落在 OVERLAY 内部 → 上下文其实就是本仓库的一个子目录；
          #      - OVERLAY 落在 CTX 内部 → CTX 是工作区根，这正是 `context: .` 写错时
          #        的形态。只查第一个方向是不够的，第二种才是最容易犯的错。
          case "${CTX}" in
            "${OVERLAY}"|"${OVERLAY}"/*)
              echo "::error::CTX 位于本仓库检出内部"; exit 1 ;;
          esac
          case "${OVERLAY}" in
            "${CTX}"|"${CTX}"/*)
              echo "::error::CTX 是本仓库检出的祖先 —— context 很可能被误设为工作区根"; exit 1 ;;
          esac

          # 3) 它的 origin 必须指向上游。
          origin="$(git -C "${CTX}" remote get-url origin)"
          [ "${origin}" = "${UPSTREAM_URL}" ] \
            || { echo "::error::上下文 origin=${origin}，不是上游"; exit 1; }

          # 4) 它的 HEAD 必须是本次解析出的上游 SHA。
          head_sha="$(git -C "${CTX}" rev-parse HEAD)"
          [ "${head_sha}" = "${UPSTREAM_SHA}" ] \
            || { echo "::error::上下文 HEAD=${head_sha} != 上游 ${UPSTREAM_SHA}"; exit 1; }

          # 5) ★ 零泄漏探针：干净 clone 里不应存在任何**未跟踪文件**。
          #    为什么不去探测 `.github/` 是否存在：上游将来往 .github/ 加
          #    dependabot.yml / CODEOWNERS / 自带 workflow 是完全正常的，而且
          #    .dockerignore 并没有排除 .github/ —— 那种情况下探测会**假阳性**。
          #    正确的探针要跟"上游的目录布局"无关：本仓库的文件若混入上下文，
          #    必然表现为未跟踪文件。不带 --exclude-standard，连被忽略的也一并暴露。
          extra="$(git -C "${CTX}" ls-files --others)"
          if [ -n "${extra}" ]; then
            echo "::error::构建上下文里出现未跟踪文件 —— 本仓库的文件泄漏进了构建上下文"
            printf '%s\n' "${extra}" | head -50
            exit 1
          fi

          # 6) 零补丁 ⇒ 工作区必须干净 ⇒ 上下文与上游提交逐字节相同。
          dirty="$(git -C "${CTX}" status --porcelain)"
          if [ "${{ steps.patch.outputs.count }}" = "0" ] && [ -n "${dirty}" ]; then
            echo "::error::零补丁但工作区不干净，上下文并非纯上游："
            echo "${dirty}"; exit 1
          fi

          # 7) 构建必需的子模块必须真的有内容。
          for d in node_server user-frontend/dist; do
            [ -n "$(ls -A "${CTX}/${d}" 2>/dev/null)" ] \
              || { echo "::error::子模块目录 ${d} 为空，构建上下文不完整"; exit 1; }
          done

          {
            echo "### 构建上下文来源断言：全部通过"
            echo ""
            echo "| 断言 | 值 |"
            echo "|---|---|"
            echo "| 上下文 origin | \`${origin}\` |"
            echo "| 上下文 HEAD | \`${head_sha}\` |"
            echo "| 与上游提交一致 | ✅ |"
            echo "| CTX / OVERLAY 互不包含 | ✅ |"
            echo "| 上下文内未跟踪文件 | ❌ 无（零泄漏） |"
            echo "| 补丁数 | ${{ steps.patch.outputs.count }} |"
            echo "| 工作区改动 | \`${dirty:-<无>}\` |"
            echo ""
            echo "⇒ 构建上下文与本仓库的内容**无关**：本仓库即使一个上游源文件都没有，"
            echo "  本 job 依然产出完全相同的镜像。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 构建前置检查
        run: |
          set -euo pipefail
          for f in Dockerfile requirements.txt .dockerignore .env.example; do
            [ -f "${CTX}/${f}" ] || { echo "::error::上下文缺少 ${f}"; exit 1; }
          done
          echo "构建上下文文件数: $(find "${CTX}" -type f | wc -l)"

      # 门禁：**仅在有补丁时自动启用**（见文件头"测试门禁的取舍"）。
      - name: 运行上游测试套件（有补丁时自动启用）
        if: needs.resolve.outputs.run_tests == 'true' || steps.patch.outputs.count != '0'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r "${CTX}/requirements.txt"
          pip install "pytest==9.1.1" "pytest-asyncio==1.4.0" pytest-timeout
          # 上游快照并非全绿，用 known-failures 列表显式 deselect（列表在本仓库里）。
          DESELECT=""
          if [ -f "${OVERLAY}/.github/pytest-known-failures.txt" ]; then
            DESELECT=$(sed 's/^/--deselect=/' "${OVERLAY}/.github/pytest-known-failures.txt" | tr '\n' ' ')
          fi
          cd "${CTX}"
          # 这两个 --ignore 不是可有可无：它们依赖 specs/，而 specs/ 是上游仓库里
          # 不存在的目录，收集阶段就会 FileNotFoundError。
          python -m pytest -q --timeout=300 --timeout-method=thread \
            --ignore=tests/test_eaichat_fence_json_aware.py \
            --ignore=tests/test_eaichat_stream_fixtures.py \
            $DESELECT

      - name: Set up QEMU / Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与版本号
        id: ver
        env:
          INPUT_VERSION: ${{ needs.resolve.outputs.version }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then v="${INPUT_VERSION}"; else v="upstream-${SHORT}"; fi
          primary="${IMAGE}:${SHORT}"
          tags="${primary},${IMAGE}:latest"
          if [ -n "${INPUT_VERSION}" ]; then tags="${tags},${IMAGE}:${INPUT_VERSION}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "版本号 = ${v}"
          echo "主标签 = ${primary}"
          echo "标签   = ${tags}"

      - name: 构建（上下文 = 上游 clone）
        uses: docker/build-push-action@v6
        with:
          # ★ 注意：context 指向上游 clone，**不是** `.`
          context: ${{ env.CTX }}
          file: ${{ env.CTX }}/Dockerfile
          # 多架构镜像只能 push（daemon 存不下 manifest list），演练模式退化为单平台。
          platforms: ${{ needs.resolve.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ needs.resolve.outputs.publish == 'true' }}
          load: ${{ needs.resolve.outputs.publish != 'true' }}
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            DOCKER_REGISTRY_PREFIX=
            APP_VERSION=${{ steps.ver.outputs.version }}
          # 来源可追溯：镜像元数据直接声明上游仓库与上游提交。
          labels: |
            org.opencontainers.image.title=ai-lubricant (overlay build)
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=overlay
          cache-to: type=gha,mode=max,scope=overlay

      - name: 汇总
        if: always()
        run: |
          {
            echo "## Overlay 构建"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 | \`${UPSTREAM_REPO}\` |"
            echo "| 上游提交 | \`${UPSTREAM_SHA}\` |"
            echo "| 构建上下文 | \`upstream-src/\`（上游 clone，非本仓库） |"
            echo "| 补丁数 | ${{ steps.patch.outputs.count }} |"
            echo "| 镜像 | \`${{ steps.ver.outputs.tags }}\` |"
            echo "| 版本号 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| 推送 | ${{ needs.resolve.outputs.publish }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 验收：把**刚推上去的**镜像拉回来真跑（amd64 + arm64 各一次）──────────
  # 这一步是「构建成功」与「镜像能用」之间的分界。只看 build 绿是不够的。
  # 用矩阵覆盖两种架构：构建出 manifest list 不等于 arm64 那份真能跑。
  verify:
    name: 拉取已发布镜像并冒烟 (${{ matrix.arch }})
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    env:
      # 用 build job 实际推上去的主标签，不自己再拼一遍。
      REF: ${{ needs.build.outputs.primary_tag }}

    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取刚发布的镜像（并记录 digest 与架构）
        run: |
          set -euo pipefail
          docker pull "${REF}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${REF}")"
          echo "REF=${REF}" >> "$GITHUB_ENV"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "拉取到 ${digest}"
          echo "本 runner 架构 = $(docker version --format '{{.Server.Arch}}')"
          docker image inspect "${REF}" --format '镜像架构 = {{.Architecture}}'

      # 只用上游的 .env.example 作为模板，不依赖本仓库的任何文件。
      - name: 取上游 .env.example（稀疏检出，只拉这一个文件）
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/${UPSTREAM_REPO}.git meta
          git -C meta sparse-checkout set --no-cone .env.example
          git -C meta checkout
          test -f meta/.env.example

      - name: 生成 .env（对齐 .env.example，填充必填密钥与内网服务名）
        run: |
          python - <<'PY'
          import pathlib, secrets
          text = pathlib.Path("meta/.env.example").read_text(encoding="utf-8")
          text = text.replace("POSTGRES_HOST=127.0.0.1", "POSTGRES_HOST=postgres")
          text = text.replace("REDIS_HOST=127.0.0.1", "REDIS_HOST=redis")
          text = text.replace("POSTGRES_USER=your_pg_user", "POSTGRES_USER=ai_lubricant")
          text = text.replace("POSTGRES_PASSWORD=your_pg_password", "POSTGRES_PASSWORD=ai_lubricant")
          text = text.replace("NODE_CONTROL_TOKEN=", "NODE_CONTROL_TOKEN=" + secrets.token_urlsafe(32))
          text = text.replace("NODE_CREDENTIAL_ENCRYPTION_KEY=", "NODE_CREDENTIAL_ENCRYPTION_KEY=" + secrets.token_hex(32))
          text = text.replace("AGENT_ATTACHMENT_SIGNING_KEY=", "AGENT_ATTACHMENT_SIGNING_KEY=" + secrets.token_urlsafe(48))
          pathlib.Path(".env").write_text(text, encoding="utf-8")
          print("wrote .env")
          PY

      - name: 起 PG / Redis
        run: |
          set -euo pipefail
          docker network create ai-lubricant-ov
          docker run -d --name postgres --network ai-lubricant-ov \
            -e POSTGRES_USER=ai_lubricant -e POSTGRES_PASSWORD=ai_lubricant \
            -e POSTGRES_DB=ai-lubricant -e TZ=Asia/Shanghai postgres:16-alpine
          docker run -d --name redis --network ai-lubricant-ov \
            redis:7-alpine redis-server --maxmemory-policy noeviction --appendonly yes
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -U ai_lubricant -d ai-lubricant >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 60); do
            [ "$(docker exec redis redis-cli ping 2>/dev/null)" = "PONG" ] && break
            sleep 2
          done

      - name: 运行镜像
        run: |
          set -euo pipefail
          docker run -d --name ai-lubricant --network ai-lubricant-ov \
            --env-file .env \
            -e POSTGRES_HOST=postgres -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=ai_lubricant -e POSTGRES_PASSWORD=ai_lubricant \
            -e POSTGRES_DATABASE=ai-lubricant \
            -e REDIS_HOST=redis -e REDIS_PORT=6379 \
            -e SERVER_PORT=8001 -e DEBUG=false \
            -p 3006:8001 "${REF}"

      - name: 冒烟（轮询 /mcp/health，校验 /v1/models）
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3006/mcp/health || true)
            echo "attempt $i: /mcp/health -> $code"
            [ "$code" = "200" ] && { ok=1; break; }
            [ "$(docker inspect -f '{{.State.Running}}' ai-lubricant 2>/dev/null)" = "true" ] \
              || { echo "container exited early"; break; }
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::/mcp/health 未在预期时间内返回 200"; exit 1; }
          curl -fsS http://localhost:3006/mcp/health; echo
          curl -fsS -o /dev/null -w 'GET /v1/models -> %{http_code}\n' http://localhost:3006/v1/models

      - name: 核验镜像内版本标识与来源标注
        run: |
          set -euo pipefail
          echo "镜像内 APP_VERSION = $(docker exec ai-lubricant printenv APP_VERSION)"
          echo "镜像 OCI 来源标注："
          docker image inspect "${REF}" \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}} @ {{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: 失败时导出日志
        if: failure()
        run: |
          echo "===== ai-lubricant ====="; docker logs ai-lubricant --tail 300 || true
          echo "===== postgres ====="; docker logs postgres --tail 80 || true
          echo "===== redis ====="; docker logs redis --tail 80 || true

      - name: 清理
        if: always()
        run: |
          docker rm -f ai-lubricant postgres redis >/dev/null 2>&1 || true
          docker network rm ai-lubricant-ov >/dev/null 2>&1 || true

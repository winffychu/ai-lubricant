# docker-compose.yml — Ai Lubricant 私有化部署编排
#
# 五个服务：postgres / redis（数据依赖）、ai-lubricant（数据服务，
# 含 Agent 运行时）、node-server（节点控制面）、tunnel-server（内网穿透运行时）。
# ClickHouse 可选（profile: clickhouse）。主服务的 Agent 记忆、附件、SOP、资源镜像、
# 日志等运行时状态均 bind mount 到宿主 ./data/ 下（已 gitignore），数据随目录保留。

# ---- 复用锚点 ----
# 日志轮转：默认 json-file 无上限，长跑会撑满磁盘；统一限制单文件 10m、保留 3 个。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 三个 app 服务共享同一镜像（build 一次，image 复用），以及 restart/init/日志/网络。
#
# 只由 ai-lubricant 服务持有 build:（产出 ai-lubricant:<TAG> 这个 tag）；node-server /
# tunnel-server 只声明 image: 引用同一 tag。三个服务都带 build: 时 compose 会对同一
# tag 并行构建三次，互相报 "image already exists"；两个纯引用服务在本地无该 tag 时
# 会被当远程镜像去 pull（daemon 加速器回 403）。镜像存在后 compose 复用，不重复构建。
x-app-image: &app-image
  # 镜像 tag 由 ai-lubricant 的 build 产出；另两个服务只引用（去掉 build: 避免同 tag
  # 并行构建冲突与被误当远程镜像 pull）。
  image: ai-lubricant:${TAG:-local}
  restart: unless-stopped
  init: true
  env_file:
    - .env
  logging: *logging
  networks:
    - ai-lubricant-net
  # 三个 app 服务统一挂载宿主 .env（单文件 bind mount）。node-server/tunnel-server
  # 首启自动生成的 NODE_CONTROL_TOKEN / NODE_CREDENTIAL_ENCRYPTION_KEY 必须写回
  # 宿主文件，main 才能读到——不挂载的话 node-server 只会写进自己容器层，main
  # 永远读到空 token（节点页报「未配置控制面」）。单文件 bind mount 下写回的
  # rename 会报 EBUSY，由 dotenv_loader 的原地重写 fallback 落盘。
  volumes:
    - ./.env:/app/.env

# 主服务独有：build 定义（Docker Hub 基础镜像前缀，国内部署经 MIRROR_MODE=cn 的
# DOCKER_REGISTRY_PREFIX 注入；空 = 直连 Docker Hub）。
x-app-build: &app-build
  build:
    context: .
    args:
      DOCKER_REGISTRY_PREFIX: "${DOCKER_REGISTRY_PREFIX:-}"
      # 版本号烧进镜像 ENV APP_VERSION：与 TAG 同源，升级卡片/版本端点据此回答当前运行版本。
      APP_VERSION: "${TAG:-local}"

# app 服务共用的 DB/Redis 内网连接（指向 compose 内服务名，覆盖 env.ini/.env 里的默认）。
x-db-env: &db-env
  TZ: Asia/Shanghai
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "${POSTGRES_USER:-ai_lubricant}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ai_lubricant}"
  POSTGRES_DATABASE: "${POSTGRES_DATABASE:-ai-lubricant}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  postgres:
    # Docker Hub 前缀国内加速（MIRROR_MODE=cn 时 DOCKER_REGISTRY_PREFIX 非空）。
    image: ${DOCKER_REGISTRY_PREFIX:-}postgres:16-alpine
    container_name: ai-lubricant-postgres
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai_lubricant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai_lubricant}
      - POSTGRES_DB=${POSTGRES_DATABASE:-ai-lubricant}
      - TZ=Asia/Shanghai
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
    ports:
      # 左侧为 host 端口（仅本机调试用；生产建议从对外映射里去掉）。
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_lubricant} -d ${POSTGRES_DATABASE:-ai-lubricant}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ai-lubricant-net

  redis:
    image: ${DOCKER_REGISTRY_PREFIX:-}redis:7-alpine
    container_name: ai-lubricant-redis
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - ./data/redis_data:/data
    ports:
      # 左侧为 host 端口（仅本机调试用；生产建议从对外映射里去掉）。
      - "${REDIS_PORT:-6479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ai-lubricant-net

  # 可选：ClickHouse — ai-lubricant 主链路请求日志改造用（PG 存元数据、大字段 payload 双写到此）。
  # 与 upstream 兼容层无关：mc_* 表全在 postgres 里。默认不启动。
  # 启用：设置 CLICKHOUSE_REQUEST_PAYLOAD_ENABLED=true 后 docker compose --profile clickhouse up -d
  clickhouse:
    image: ${DOCKER_REGISTRY_PREFIX:-}clickhouse/clickhouse-server:24-alpine
    container_name: ai-lubricant-clickhouse
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    profiles: ["clickhouse"]
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-ai_lubricant_logs}
      - CLICKHOUSE_USER=${CLICKHOUSE_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - TZ=Asia/Shanghai
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./data/clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ai-lubricant-net

  # 数据服务（含 Agent 运行时）：对外 API、管理接口、Agent 与 MCP runtime。
  # 唯一持有 build: 的服务——产出共享镜像 tag，node-server/tunnel-server 复用。
  ai-lubricant:
    <<: [*app-image, *app-build]
    container_name: ai-lubricant
    ports:
      - "${AI_LUBRICANT_HOST_PORT:-3006}:8001"
      # 局域网发现（UDP 广播应答，docs/lan-discovery.md）。注意：published UDP 端口
      # 下广播穿透在部分内核/网络栈不可靠（Windows Docker Desktop 必失效），生产
      # 环境建议裸跑或 network_mode: host。
      - "${LAN_DISCOVERY_PORT:-58160}:58160/udp"
    environment:
      <<: *db-env
      DEBUG: "false"
      # 局域网发现通告的 HTTP 端口 = 宿主映射端口（手机从容器外连，不是容器内 8001）。
      LAN_DISCOVERY_HTTP_PORT: "${AI_LUBRICANT_HOST_PORT:-3006}"
      # 主服务调用节点控制面（编辑器工作区、终端、任务下发等 user_platform 路由都走它）。
      AGENT_COMPOSE_BASE_URL: "${AGENT_COMPOSE_BASE_URL:-http://node-server:8003}"
      # ClickHouse 数据源（可选；未启用时主链路照常运行，仅跳过 payload 双写）。
      CLICKHOUSE_ADDR: clickhouse:8123
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-ai_lubricant_logs}"
      CLICKHOUSE_USERNAME: "${CLICKHOUSE_USERNAME:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_REQUEST_PAYLOAD_ENABLED: "${CLICKHOUSE_REQUEST_PAYLOAD_ENABLED:-false}"
    volumes:
      # ---- 运行时持久化（Agent / 附件 / 备份 / 镜像 / 日志）----
      # Agent 记忆与工作区：data/agents/<id>/{memory,workspace,temp}，以及
      # data/agent-resources（Skill/插件归档）、data/agent-sops（SOP 正文，管理端可编辑）、
      # data/generic-agent-memory（legacy 迁移源）。
      - ./data/ai_data:/app/data
      # 上传附件对象存储（server/attachment_store.py，30 天 TTL + 90 天宽限）。
      - ./data/ai_attachments:/app/agent/attachments
      # 删除渠道/账号前自动写入的 JSON 备份（server/admin.py）。
      - ./data/ai_deleted_backups:/app/deleted_backups
      # 管理端触发的资源镜像 tar.gz（节点拉取源，server/resources_api.py）。
      - ./data/ai_resource_mirrors:/app/static/resource_mirrors
      # 主服务文件日志（loguru 按天轮转、保留 30 天）。
      - ./data/ai_logs:/app/logs
      # 服务会回写 /app/.env（如自动生成的 AGENT_ATTACHMENT_SIGNING_KEY）；
      # 挂载宿主文件使其跨容器重建存续。需先 `cp .env.example .env`。
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 主服务的编辑器/终端/任务路由依赖 node-server，排在它之后启动。
      node-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/mcp/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ai-lubricant-net

  # 独立节点控制面：接收 execution/management 节点的 h2c NodeConnect，并提供
  # tunnel-server 使用的 Start/Stop/ListActiveToolRuns 控制接口。
  node-server:
    <<: *app-image
    container_name: ai-lubricant-node-server
    # 镜像 tag 由 ai-lubricant 的 build 产出，永不远程拉取（避免 compose 在 build
    # 完成前把它当远程引用去 HEAD，白等加速器 403）。
    pull_policy: never
    command: ["python", "-m", "node_server"]
    environment:
      <<: *db-env
      NODE_CONTROL_HOST: 0.0.0.0
      NODE_CONTROL_PORT: "8003"
    ports:
      - "${NODE_CONTROL_PUBLIC_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ai-lubricant-net

  # 独立 Tunnel Runtime 服务：唯一负责 __main__ 本机穿透子进程 + 数据库 runtime
  # 对账的进程。主服务只写 desired state + NOTIFY，不启动子进程。与主服务共享
  # mc_tunnel_* 表与 node_server，但生命周期完全独立。默认只部署一个实例（多副本
  # 依赖 TunnelRuntime 的 DB 租约避免重复 stop/start）。
  tunnel-server:
    <<: *app-image
    container_name: ai-lubricant-tunnel-server
    # 同 node-server：镜像由 ai-lubricant 的 build 产出，永不远程拉取。
    pull_policy: never
    command: ["python", "-m", "tunnel_server"]
    stop_grace_period: 30s
    environment:
      <<: *db-env
      # 节点穿透经独立 node-server 控制面下发。
      AGENT_COMPOSE_BASE_URL: "${AGENT_COMPOSE_BASE_URL:-http://node-server:8003}"
      TUNNEL_RUNTIME_HOST: 0.0.0.0
      TUNNEL_RUNTIME_PORT: "8004"
      TUNNEL_RUNTIME_ENABLED: "${TUNNEL_RUNTIME_ENABLED:-true}"
      TUNNEL_RUNTIME_NOTIFY_CHANNEL: "${TUNNEL_RUNTIME_NOTIFY_CHANNEL:-tunnel_runtime_changed}"
      TUNNEL_RUNTIME_RECONCILE_POLL_SECONDS: "${TUNNEL_RUNTIME_RECONCILE_POLL_SECONDS:-30}"
      TUNNEL_RUNTIME_LEASE_TTL_SECONDS: "${TUNNEL_RUNTIME_LEASE_TTL_SECONDS:-60}"
      TUNNEL_RUNTIME_INSTANCE_ID: "${TUNNEL_RUNTIME_INSTANCE_ID:-}"
      # frpc/cloudflared/npc 二进制下载缓存，跨重建复用（user_platform/tunnel_binaries.py）。
      MC_TUNNEL_BIN_DIR: /data/mc-tunnel-bins
    volumes:
      - ./data/ai_tunnel_bins:/data/mc-tunnel-bins
      # tunnel 的启停要带 token 调 node-server；自有的 volumes 覆盖了锚点，这里补上
      # 宿主 .env 挂载（node-server 首启写回的 token 由本服务启动时读到）。
      - ./.env:/app/.env
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
      # 隧道的启停都经 AGENT_COMPOSE_BASE_URL 调 node-server，排在它之后启动。
      node-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/ready',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ai-lubricant-net

networks:
  ai-lubricant-net:
    driver: bridge

# 持久化不使用命名卷：所有运行时目录 bind mount 到宿主 ./data/ 下（data/ 已
# gitignore），数据直接落宿主文件系统，便于查看/备份/迁移；`docker compose down -v`
# 也不再涉及这些数据（清数据 = 直接删 ./data/ 对应子目录）。
